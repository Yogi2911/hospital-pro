name: Multi Environment Deployment

on:
  push:
    branches:
      - dev
      - qa
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod

      deploy_tag:
        description: "Select image to deploy"
        required: true
        type: choice
        options:
          - latest
          - latest -1
          - latest -2
          - latest -3
          - latest -4

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: Hosp-Task-26
  IMAGE_NAME: hospital-api

  DEV_APP: hospital-dev
  QA_APP: hospital-qa
  PROD_APP: hospital-prod

jobs:

  deploy:

    runs-on: ubuntu-latest

    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || (github.ref_name == 'main' && 'prod' || github.ref_name) }}

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # 2. AZURE LOGIN
      # ==========================================================

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      # ==========================================================
      # 3. DECIDE ENVIRONMENT
      # ==========================================================

      - name: Decide Environment
        shell: bash
        run: |

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            DEPLOY_ENV="${{ github.event.inputs.environment }}"

          else

            BRANCH="${GITHUB_REF_NAME}"

            if [ "$BRANCH" = "dev" ]; then

              DEPLOY_ENV="dev"

            elif [ "$BRANCH" = "qa" ]; then

              DEPLOY_ENV="qa"

            elif [ "$BRANCH" = "main" ]; then

              DEPLOY_ENV="prod"

            else

              echo "Invalid branch: $BRANCH"
              exit 1

            fi

          fi

          echo "DEPLOY_ENV=$DEPLOY_ENV" >> "$GITHUB_ENV"

          echo "======================================"
          echo "Environment: $DEPLOY_ENV"
          echo "======================================"


      # ==========================================================
      # 4. SELECT ENVIRONMENT ACR + CONTAINER APP
      # ==========================================================

      - name: Select ACR and Container App
        shell: bash
        run: |

          if [ "$DEPLOY_ENV" = "dev" ]; then

            echo "ACR_NAME=hospdevacr26" >> "$GITHUB_ENV"
            echo "ACR_LOGIN_SERVER=hospdevacr26.azurecr.io" >> "$GITHUB_ENV"
            echo "APP_NAME=$DEV_APP" >> "$GITHUB_ENV"

          elif [ "$DEPLOY_ENV" = "qa" ]; then

            echo "ACR_NAME=hospacrqa" >> "$GITHUB_ENV"
            echo "ACR_LOGIN_SERVER=hospacrqa.azurecr.io" >> "$GITHUB_ENV"
            echo "APP_NAME=$QA_APP" >> "$GITHUB_ENV"

          elif [ "$DEPLOY_ENV" = "prod" ]; then

            echo "ACR_NAME=hospacr26" >> "$GITHUB_ENV"
            echo "ACR_LOGIN_SERVER=hospacr26.azurecr.io" >> "$GITHUB_ENV"
            echo "APP_NAME=$PROD_APP" >> "$GITHUB_ENV"

          else

            echo "Invalid environment"
            exit 1

          fi

          echo "======================================"
          echo "Environment : $DEPLOY_ENV"
          echo "Registry    : $ACR_NAME"
          echo "Server      : $ACR_LOGIN_SERVER"
          echo "App         : $APP_NAME"
          echo "======================================"


      # ==========================================================
      # 5. LOGIN TO SELECTED ACR
      # ==========================================================

      - name: Login to ACR
        run: |

          az acr login --name "$ACR_NAME"


      # ==========================================================
      # 6. AUTOMATIC IMAGE TAG
      #
      # Runs ONLY for git push
      # ==========================================================

      - name: Generate Automatic Image Tag
        if: github.event_name == 'push'
        shell: bash
        run: |

          VERSION="${{ vars.VERSION }}"

          BUILD="${{ github.run_number }}"

          IMAGE_TAG="v${VERSION}-${DEPLOY_ENV}-b${BUILD}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          echo "======================================"
          echo "AUTOMATIC DEPLOYMENT"
          echo "======================================"
          echo "Environment : $DEPLOY_ENV"
          echo "Image Tag   : $IMAGE_TAG"
          echo "Registry    : $ACR_NAME"
          echo "======================================"


      # ==========================================================
      # 7. BUILD DOCKER IMAGE
      #
      # Only automatic deployment
      # ==========================================================

      - name: Build Docker Image
        if: github.event_name == 'push'
        run: |

          echo "Building image..."

          docker build \
            -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG" \
            .

          echo "Build completed."


      # ==========================================================
      # 8. PUSH DOCKER IMAGE
      #
      # Only automatic deployment
      # ==========================================================

      - name: Push Docker Image
        if: github.event_name == 'push'
        run: |

          echo "Pushing image..."

          docker push \
            "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"

          echo "Image pushed successfully."


      # ==========================================================
      # 9. SHOW LATEST ENVIRONMENT-SPECIFIC TAGS
      #
      # Only rollback
      # ==========================================================

      - name: Get Latest 5 Environment Images
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |

          echo "======================================"
          echo "AVAILABLE $DEPLOY_ENV IMAGES"
          echo "======================================"

          ALL_TAGS=$(az acr repository show-tags \
            --name "$ACR_NAME" \
            --repository "$IMAGE_NAME" \
            --orderby time_desc \
            --output json)

          FILTERED_TAGS=$(echo "$ALL_TAGS" | jq -c --arg ENV "$DEPLOY_ENV" '
            map(select(test("^v.*-" + $ENV + "-b[0-9]+$")))
            | .[0:5]
          ')

          if [ "$(echo "$FILTERED_TAGS" | jq 'length')" -eq 0 ]; then

            echo "No $DEPLOY_ENV images found in $ACR_NAME."

            exit 1

          fi

          echo "$FILTERED_TAGS" | jq -r '.[]'


      # ==========================================================
      # 10. DETERMINE ROLLBACK IMAGE
      #
      # latest      = index 0
      # latest -1   = index 1
      # latest -2   = index 2
      # latest -3   = index 3
      # latest -4   = index 4
      # ==========================================================

      - name: Determine Rollback Image
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |

          SELECTED="${{ github.event.inputs.deploy_tag }}"

          echo "Selected rollback option: $SELECTED"

          # Get all tags from the selected ACR
          ALL_TAGS=$(az acr repository show-tags \
            --name "$ACR_NAME" \
            --repository "$IMAGE_NAME" \
            --orderby time_desc \
            --output json)

          # Keep ONLY the selected environment's tags
          ENV_TAGS=$(echo "$ALL_TAGS" | jq -c --arg ENV "$DEPLOY_ENV" '
            map(select(test("^v.*-" + $ENV + "-b[0-9]+$")))
            | .[0:5]
          ')

          echo "Environment-specific tags:"
          echo "$ENV_TAGS" | jq -r '.[]'


          # Determine requested index

          if [ "$SELECTED" = "latest" ]; then

            INDEX=0

          elif [ "$SELECTED" = "latest -1" ]; then

            INDEX=1

          elif [ "$SELECTED" = "latest -2" ]; then

            INDEX=2

          elif [ "$SELECTED" = "latest -3" ]; then

            INDEX=3

          elif [ "$SELECTED" = "latest -4" ]; then

            INDEX=4

          else

            echo "Invalid rollback selection."
            exit 1

          fi


          # Get selected tag

          IMAGE_TAG=$(echo "$ENV_TAGS" | jq -r ".[$INDEX]")


          # Check image exists

          if [ "$IMAGE_TAG" = "null" ] || [ -z "$IMAGE_TAG" ]; then

            echo "======================================"
            echo "ROLLBACK FAILED"
            echo "======================================"

            echo "Requested: $SELECTED"

            echo "Only $(echo "$ENV_TAGS" | jq 'length') image(s) are available."

            exit 1

          fi


          # Save selected image

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"


          echo "======================================"
          echo "ROLLBACK DEPLOYMENT"
          echo "======================================"
          echo "Environment : $DEPLOY_ENV"
          echo "Selection   : $SELECTED"
          echo "Image Tag   : $IMAGE_TAG"
          echo "Registry    : $ACR_NAME"
          echo "Image       : $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"
          echo "======================================"


      # ==========================================================
      # 11. DEPLOY CONTAINER APP
      #
      # Runs for:
      #   PUSH       → new image
      #   ROLLBACK   → existing image
      # ==========================================================

      - name: Deploy Container App
        run: |

          echo "======================================"
          echo "DEPLOYING CONTAINER APP"
          echo "======================================"

          echo "Environment : $DEPLOY_ENV"
          echo "Container   : $APP_NAME"
          echo "Image       : $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"

          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"


      # ==========================================================
      # 12. VERIFY DEPLOYMENT
      # ==========================================================

      - name: Verify Deployment
        run: |

          echo "======================================"
          echo "DEPLOYMENT COMPLETE"
          echo "======================================"

          echo "Environment : $DEPLOY_ENV"
          echo "Registry    : $ACR_NAME"
          echo "Image       : $IMAGE_TAG"
          echo "Container   : $APP_NAME"

          echo ""
          echo "Container App is running image:"

          az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.template.containers[0].image" \
            -o tsv 