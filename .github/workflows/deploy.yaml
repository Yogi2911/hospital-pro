name: Hospital API Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod

      deploy_tag:
        description: "Select image version"
        required: true
        type: choice
        options:
          - latest
          - latest -1
          - latest -2
          - latest -3
          - latest -4

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: Hosp-Task-26
  REPOSITORY_NAME: hospital-api

jobs:

  # =====================================================
  # 1. Convert latest / latest -1 / etc. to an index
  # =====================================================

  translate_selected_tag_index:

    runs-on: ubuntu-latest

    outputs:
      tag_index: ${{ steps.translate.outputs.tag_index }}

    steps:

      - name: Translate selected tag
        id: translate
        shell: bash
        run: |

          if [[ "${{ inputs.deploy_tag }}" == "latest" ]]; then

            echo "tag_index=0" >> "$GITHUB_OUTPUT"

          else

            INDEX=$(echo "${{ inputs.deploy_tag }}" | sed 's/latest -//')

            echo "tag_index=$INDEX" >> "$GITHUB_OUTPUT"

          fi


  # =====================================================
  # 2. Select ACR and Container App
  # =====================================================

  prepare:

    runs-on: ubuntu-latest

    needs:
      - translate_selected_tag_index

    outputs:
      acr_name: ${{ steps.environment.outputs.acr_name }}
      acr_login_server: ${{ steps.environment.outputs.acr_login_server }}
      container_app: ${{ steps.environment.outputs.container_app }}
      image: ${{ steps.determine_image.outputs.image }}

    steps:

      # -------------------------------------------------
      # Select environment configuration
      # -------------------------------------------------

      - name: Select environment
        id: environment
        shell: bash
        run: |

          if [[ "${{ inputs.environment }}" == "dev" ]]; then

            echo "acr_name=hospdevacr26" >> "$GITHUB_OUTPUT"
            echo "acr_login_server=hospdevacr26.azurecr.io" >> "$GITHUB_OUTPUT"
            echo "container_app=hospital-dev" >> "$GITHUB_OUTPUT"

          elif [[ "${{ inputs.environment }}" == "qa" ]]; then

            echo "acr_name=hospacrqa" >> "$GITHUB_OUTPUT"
            echo "acr_login_server=hospacrqa.azurecr.io" >> "$GITHUB_OUTPUT"
            echo "container_app=hospital-qa" >> "$GITHUB_OUTPUT"

          elif [[ "${{ inputs.environment }}" == "prod" ]]; then

            echo "acr_name=hospacr26" >> "$GITHUB_OUTPUT"
            echo "acr_login_server=hospacr26.azurecr.io" >> "$GITHUB_OUTPUT"
            echo "container_app=hospital-prod" >> "$GITHUB_OUTPUT"

          else

            echo "Invalid environment"
            exit 1

          fi


      # -------------------------------------------------
      # Azure Login
      # -------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      # -------------------------------------------------
      # Get latest 5 image tags
      # -------------------------------------------------

      - name: Get latest 5 image tags
        id: get_latest_image_tags
        shell: bash
        env:
          NUM_TAGS: 5
        run: |

          echo "Checking registry:"
          echo "${{ steps.environment.outputs.acr_name }}"

          RECENT_TAGS=$(az acr repository show-tags \
            --name "${{ steps.environment.outputs.acr_name }}" \
            --repository "${{ env.REPOSITORY_NAME }}" \
            --top "$NUM_TAGS" \
            --orderby time_desc \
            --output json)

          echo "Available tags:"
          echo "$RECENT_TAGS"

          echo "recent_tags=$(echo "$RECENT_TAGS" | jq -c -M)" >> "$GITHUB_OUTPUT"


      # -------------------------------------------------
      # Determine selected image
      # -------------------------------------------------

      - name: Determine image to deploy
        id: determine_image
        shell: bash
        env:
          SELECTED_TAG_INDEX: ${{ needs.translate_selected_tag_index.outputs.tag_index }}
        run: |

          IMAGE_TAG=$(echo '${{ steps.get_latest_image_tags.outputs.recent_tags }}' \
            | jq -r ".[$SELECTED_TAG_INDEX]")

          if [[ "$IMAGE_TAG" == "null" || -z "$IMAGE_TAG" ]]; then

            echo "::error::Requested image tag does not exist."

            exit 1

          fi

          IMAGE="${{ steps.environment.outputs.acr_login_server }}/${{ env.REPOSITORY_NAME }}:${IMAGE_TAG}"

          echo "Selected image:"
          echo "$IMAGE"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"


  # =====================================================
  # 3. Rollback Container App
  # =====================================================

  rollback:

    runs-on: ubuntu-latest

    needs:
      - prepare

    environment: ${{ inputs.environment }}

    steps:

      # -------------------------------------------------
      # Azure Login
      # -------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      # -------------------------------------------------
      # Show rollback information
      # -------------------------------------------------

      - name: Show rollback information
        run: |

          echo "=========================================="
          echo "Hospital API Rollback"
          echo "=========================================="

          echo "Environment:"
          echo "${{ inputs.environment }}"

          echo "Container App:"
          echo "${{ needs.prepare.outputs.container_app }}"

          echo "ACR:"
          echo "${{ needs.prepare.outputs.acr_name }}"

          echo "Image:"
          echo "${{ needs.prepare.outputs.image }}"

          echo "=========================================="


      # -------------------------------------------------
      # Rollback Container App
      # -------------------------------------------------

      - name: Rollback Container App
        run: |

          az containerapp update \
            --name "${{ needs.prepare.outputs.container_app }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --image "${{ needs.prepare.outputs.image }}"


      # -------------------------------------------------
      # Verify rollback
      # -------------------------------------------------

      - name: Show current image
        run: |

          echo "Current Container App image:"

          az containerapp show \
            --name "${{ needs.prepare.outputs.container_app }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "properties.template.containers[0].image" \
            -o tsv