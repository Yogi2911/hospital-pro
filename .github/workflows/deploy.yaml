name: Multi Environment Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select Environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod

      version:
        description: "Application Version"
        required: true
        default: "1.0.0"

      build:
        description: "Build Number"
        required: true
        default: "1"

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: hospacr26
  ACR_LOGIN_SERVER: hospacr26.azurecr.io
  IMAGE_NAME: hospital-api

  DEV_APP: hospital-dev
  QA_APP: hospital-qa
  PROD_APP: hospital-prod

  RESOURCE_GROUP: Hosp-Task-26

jobs:

  deploy:

    runs-on: ubuntu-latest

    environment: ${{ github.event.inputs.environment }}

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      ##############################################################

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      ##############################################################

      - name: Login to Azure Container Registry
        run: |
          az acr login --name $ACR_NAME

      ##############################################################

      - name: Generate Image Tag
        id: tag
        run: |

          VERSION=${{ github.event.inputs.version }}
          BUILD=${{ github.event.inputs.build }}
          ENVIRONMENT=${{ github.event.inputs.environment }}

          BRANCH=${GITHUB_REF_NAME}

          if [ "$ENVIRONMENT" = "prod" ]; then

            IMAGE_TAG=v${VERSION}.1-b${BUILD}

          else

            IMAGE_TAG=v${VERSION}-${BRANCH}-b${BUILD}

          fi

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

          echo "Generated Tag : $IMAGE_TAG"

      ##############################################################

      - name: Build Docker Image
        run: |

          docker build \
          -t $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG \
          .

      ##############################################################

      - name: Push Docker Image
        run: |

          docker push \
          $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG

      ##############################################################

      - name: Select Container App
        run: |

          ENVIRONMENT=${{ github.event.inputs.environment }}

          if [ "$ENVIRONMENT" = "dev" ]; then

              echo "APP_NAME=$DEV_APP" >> $GITHUB_ENV

          elif [ "$ENVIRONMENT" = "qa" ]; then

              echo "APP_NAME=$QA_APP" >> $GITHUB_ENV

          else

              echo "APP_NAME=$PROD_APP" >> $GITHUB_ENV

          fi

      ##############################################################

      - name: Deploy to Azure Container App
        run: |

          az containerapp update \
          --name $APP_NAME \
          --resource-group $RESOURCE_GROUP \
          --image $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG

      ##############################################################

      - name: Deployment Summary
        run: |

          echo "Environment : ${{ github.event.inputs.environment }}"
          echo "Container App : $APP_NAME"
          echo "Image : $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"