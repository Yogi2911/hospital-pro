name: Hospital API - Multi Environment Deployment

on:
  push:
    branches:
      - dev
      - qa
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: "Select target environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod

      deploy_tag:
        description: "Select image to deploy"
        required: true
        type: choice
        options:
          - latest
          - latest -1
          - latest -2
          - latest -3
          - latest -4

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: Hosp-Task-26
  IMAGE_NAME: hospital-api

  DEV_ACR: hospdevacr26
  DEV_ACR_SERVER: hospdevacr26.azurecr.io
  DEV_APP: hospital-dev

  QA_ACR: hospacrqa
  QA_ACR_SERVER: hospacrqa.azurecr.io
  QA_APP: hospital-qa

  PROD_ACR: hospacr26
  PROD_ACR_SERVER: hospacr26.azurecr.io
  PROD_APP: hospital-prod


jobs:

  # ==========================================================
  # 1. DETERMINE ENVIRONMENT
  # ==========================================================

  determine_environment:
    name: Determine Environment
    runs-on: ubuntu-latest

    outputs:
      environment: ${{ steps.environment.outputs.environment }}
      acr_name: ${{ steps.environment.outputs.acr_name }}
      acr_server: ${{ steps.environment.outputs.acr_server }}
      app_name: ${{ steps.environment.outputs.app_name }}

    steps:

      - name: Determine deployment environment
        id: environment
        shell: bash
        run: |

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            DEPLOY_ENV="${{ inputs.environment }}"

          else

            case "${GITHUB_REF_NAME}" in

              dev)
                DEPLOY_ENV="dev"
                ;;

              qa)
                DEPLOY_ENV="qa"
                ;;

              main)
                DEPLOY_ENV="prod"
                ;;

              *)
                echo "Invalid branch: ${GITHUB_REF_NAME}"
                exit 1
                ;;

            esac

          fi


          # ----------------------------------------------------
          # Select environment resources
          # ----------------------------------------------------

          case "$DEPLOY_ENV" in

            dev)

              ACR_NAME="${DEV_ACR}"
              ACR_SERVER="${DEV_ACR_SERVER}"
              APP_NAME="${DEV_APP}"

              ;;

            qa)

              ACR_NAME="${QA_ACR}"
              ACR_SERVER="${QA_ACR_SERVER}"
              APP_NAME="${QA_APP}"

              ;;

            prod)

              ACR_NAME="${PROD_ACR}"
              ACR_SERVER="${PROD_ACR_SERVER}"
              APP_NAME="${PROD_APP}"

              ;;

            *)

              echo "Invalid environment: $DEPLOY_ENV"
              exit 1

              ;;

          esac


          echo "environment=$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
          echo "acr_name=$ACR_NAME" >> "$GITHUB_OUTPUT"
          echo "acr_server=$ACR_SERVER" >> "$GITHUB_OUTPUT"
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"


          echo ""
          echo "=============================================="
          echo "ENVIRONMENT CONFIGURATION"
          echo "=============================================="
          echo "Environment : $DEPLOY_ENV"
          echo "ACR         : $ACR_NAME"
          echo "Server      : $ACR_SERVER"
          echo "Container   : $APP_NAME"
          echo "=============================================="


  # ==========================================================
  # 2. AZURE LOGIN
  # ==========================================================

  azure_login:
    name: Azure Login
    runs-on: ubuntu-latest
    needs: determine_environment

    steps:

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify Azure account
        shell: bash
        run: |

          echo "=============================================="
          echo "AZURE LOGIN SUCCESSFUL"
          echo "=============================================="

          az account show \
            --query "{Subscription:name,SubscriptionId:id,Tenant:tenantId}" \
            -o table


  # ==========================================================
  # 3. DETERMINE IMAGE
  #
  # Automatic push:
  #   Build new image
  #
  # Manual:
  #   Select latest / latest-1 / latest-2...
  # ==========================================================

  prepare_deployment:
    name: Prepare Deployment
    runs-on: ubuntu-latest

    needs:
      - determine_environment
      - azure_login

    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}

    steps:

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      # ======================================================
      # AUTOMATIC DEPLOYMENT
      # ======================================================

      - name: Generate automatic image tag
        id: automatic_tag
        if: github.event_name == 'push'
        shell: bash
        run: |

          VERSION="${{ vars.VERSION }}"

          if [ -z "$VERSION" ]; then
            echo "ERROR: VERSION variable is not configured."
            exit 1
          fi

          BUILD="${{ github.run_number }}"

          IMAGE_TAG="v${VERSION}-${{ needs.determine_environment.outputs.environment }}-b${BUILD}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          echo ""
          echo "=============================================="
          echo "AUTOMATIC DEPLOYMENT"
          echo "=============================================="
          echo "Environment : ${{ needs.determine_environment.outputs.environment }}"
          echo "Version     : $VERSION"
          echo "Build       : $BUILD"
          echo "Image       : $IMAGE_TAG"
          echo "=============================================="


      # ======================================================
      # BUILD IMAGE
      # ======================================================

      - name: Build Docker image
        if: github.event_name == 'push'
        shell: bash
        run: |

          echo "Building Docker image..."

          docker build \
            -t "${{ needs.determine_environment.outputs.acr_server }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}" \
            .

          echo "Docker image built successfully."


      # ======================================================
      # PUSH IMAGE
      # ======================================================

      - name: Login to ACR
        if: github.event_name == 'push'
        shell: bash
        run: |

          az acr login \
            --name "${{ needs.determine_environment.outputs.acr_name }}"


      - name: Push Docker image
        if: github.event_name == 'push'
        shell: bash
        run: |

          echo "Pushing image..."

          docker push \
            "${{ needs.determine_environment.outputs.acr_server }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"

          echo "Image pushed successfully."


      # ======================================================
      # MANUAL ROLLBACK
      # ======================================================

      - name: Get latest 5 environment images
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |

          echo ""
          echo "=============================================="
          echo "IMAGE HISTORY"
          echo "=============================================="

          echo "Environment : ${{ needs.determine_environment.outputs.environment }}"
          echo "ACR         : ${{ needs.determine_environment.outputs.acr_name }}"
          echo "Repository  : ${{ env.IMAGE_NAME }}"

          echo "=============================================="

          echo ""
          echo "Fetching latest images..."


          ALL_TAGS=$(az acr repository show-tags \
            --name "${{ needs.determine_environment.outputs.acr_name }}" \
            --repository "${{ env.IMAGE_NAME }}" \
            --orderby time_desc \
            --output tsv)


          # ----------------------------------------------------
          # Filter environment-specific tags
          #
          # Example:
          # v1.0.0-dev-b20
          # v1.0.0-qa-b15
          # v1.0.0-prod-b10
          # ----------------------------------------------------

          ENV="${{ needs.determine_environment.outputs.environment }}"

          ENV_TAGS=$(echo "$ALL_TAGS" \
            | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+-${ENV}-b[0-9]+$" \
            | sed -E 's/.*-b([0-9]+)$/\1|&/' \
            | sort -t'|' -k1,1nr \
            | head -5 \
            | cut -d'|' -f2)


          if [ -z "$ENV_TAGS" ]; then

            echo ""
            echo "ERROR: No images found for environment: $ENV"

            echo ""
            echo "Available images:"
            echo "$ALL_TAGS"

            exit 1

          fi


          echo ""
          echo "=============================================="
          echo "LATEST 5 $ENV IMAGES"
          echo "=============================================="


          INDEX=0

          while IFS= read -r TAG; do

            echo "[$INDEX] $TAG"

            INDEX=$((INDEX + 1))

          done <<< "$ENV_TAGS"


          echo "=============================================="


      # ======================================================
      # DETERMINE IMAGE
      # ======================================================

      - name: Determine image to deploy
        id: image
        shell: bash
        run: |

          # ----------------------------------------------------
          # Automatic deployment
          # ----------------------------------------------------

          if [ "${{ github.event_name }}" = "push" ]; then

            echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

            echo ""
            echo "=============================================="
            echo "NEW IMAGE SELECTED"
            echo "=============================================="
            echo "Image: $IMAGE_TAG"
            echo "=============================================="

            exit 0

          fi


          # ----------------------------------------------------
          # Manual rollback
          # ----------------------------------------------------

          SELECTED="${{ inputs.deploy_tag }}"

          ENV="${{ needs.determine_environment.outputs.environment }}"


          ALL_TAGS=$(az acr repository show-tags \
            --name "${{ needs.determine_environment.outputs.acr_name }}" \
            --repository "${{ env.IMAGE_NAME }}" \
            --output tsv)


          ENV_TAGS=$(echo "$ALL_TAGS" \
            | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+-${ENV}-b[0-9]+$" \
            | sed -E 's/.*-b([0-9]+)$/\1|&/' \
            | sort -t'|' -k1,1nr \
            | head -5 \
            | cut -d'|' -f2)


          # ----------------------------------------------------
          # Convert selection to index
          # ----------------------------------------------------

          case "$SELECTED" in

            "latest")
              INDEX=0
              ;;

            "latest -1")
              INDEX=1
              ;;

            "latest -2")
              INDEX=2
              ;;

            "latest -3")
              INDEX=3
              ;;

            "latest -4")
              INDEX=4
              ;;

            *)
              echo "Invalid deploy tag: $SELECTED"
              exit 1
              ;;

          esac


          # ----------------------------------------------------
          # Select image
          # ----------------------------------------------------

          IMAGE_TAG=$(echo "$ENV_TAGS" | sed -n "$((INDEX + 1))p")


          if [ -z "$IMAGE_TAG" ]; then

            echo ""
            echo "=============================================="
            echo "ROLLBACK FAILED"
            echo "=============================================="

            echo "Environment : $ENV"
            echo "Requested   : $SELECTED"
            echo "Index       : $INDEX"

            exit 1

          fi


          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"


          echo ""
          echo "=============================================="
          echo "ROLLBACK IMAGE SELECTED"
          echo "=============================================="
          echo "Environment : $ENV"
          echo "Selection   : $SELECTED"
          echo "Image       : $IMAGE_TAG"
          echo "Registry    : ${{ needs.determine_environment.outputs.acr_server }}"
          echo "=============================================="


  # ==========================================================
  # 4. DEPLOY CONTAINER APP
  # ==========================================================

  deploy:
    name: Deploy Container App
    runs-on: ubuntu-latest

    needs:
      - determine_environment
      - prepare_deployment

    environment: ${{ needs.determine_environment.outputs.environment }}

    steps:

      # ======================================================
      # AZURE LOGIN
      # ======================================================

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      # ======================================================
      # SHOW DEPLOYMENT INFORMATION
      # ======================================================

      - name: Deployment information
        shell: bash
        run: |

          echo ""
          echo "=============================================="
          echo "DEPLOYMENT"
          echo "=============================================="

          echo "Environment : ${{ needs.determine_environment.outputs.environment }}"
          echo "Container   : ${{ needs.determine_environment.outputs.app_name }}"
          echo "Resource RG : ${{ env.RESOURCE_GROUP }}"
          echo "ACR         : ${{ needs.determine_environment.outputs.acr_name }}"

          echo "Image       : ${{ needs.determine_environment.outputs.acr_server }}/${{ env.IMAGE_NAME }}:${{ needs.prepare_deployment.outputs.image_tag }}"

          echo "=============================================="


      # ======================================================
      # CHECK CONTAINER APP
      # ======================================================

      - name: Check Container App
        shell: bash
        run: |

          echo "Checking Container App..."

          if az containerapp show \
            --name "${{ needs.determine_environment.outputs.app_name }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --only-show-errors \
            -o none; then

            echo "Container App exists."

          else

            echo "ERROR: Container App does not exist."

            exit 1

          fi


      # ======================================================
      # DEPLOY IMAGE
      # ======================================================

      - name: Deploy Container App
        shell: bash
        run: |

          IMAGE="${{ needs.determine_environment.outputs.acr_server }}/${{ env.IMAGE_NAME }}:${{ needs.prepare_deployment.outputs.image_tag }}"

          echo ""
          echo "=============================================="
          echo "DEPLOYING IMAGE"
          echo "=============================================="

          echo "Container : ${{ needs.determine_environment.outputs.app_name }}"
          echo "Image     : $IMAGE"

          echo "=============================================="


          az containerapp update \
            --name "${{ needs.determine_environment.outputs.app_name }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --image "$IMAGE"


          echo ""
          echo "Container App update completed."


      # ======================================================
      # VERIFY IMAGE
      # ======================================================

      - name: Verify deployment
        shell: bash
        run: |

          echo ""
          echo "=============================================="
          echo "VERIFYING DEPLOYMENT"
          echo "=============================================="


          CURRENT_IMAGE=$(az containerapp show \
            --name "${{ needs.determine_environment.outputs.app_name }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "properties.template.containers[0].image" \
            -o tsv)


          EXPECTED_IMAGE="${{ needs.determine_environment.outputs.acr_server }}/${{ env.IMAGE_NAME }}:${{ needs.prepare_deployment.outputs.image_tag }}"


          echo ""
          echo "Expected image:"
          echo "$EXPECTED_IMAGE"

          echo ""
          echo "Current image:"
          echo "$CURRENT_IMAGE"


          if [ "$CURRENT_IMAGE" = "$EXPECTED_IMAGE" ]; then

            echo ""
            echo "=============================================="
            echo "DEPLOYMENT VERIFIED SUCCESSFULLY"
            echo "=============================================="

          else

            echo ""
            echo "=============================================="
            echo "DEPLOYMENT VERIFICATION FAILED"
            echo "=============================================="

            exit 1

          fi


      # ======================================================
      # SHOW REVISION
      # ======================================================

      - name: Show Container App revision
        shell: bash
        run: |

          echo ""
          echo "=============================================="
          echo "CONTAINER APP REVISION"
          echo "=============================================="


          az containerapp revision list \
            --name "${{ needs.determine_environment.outputs.app_name }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "[].{Name:name,Active:properties.active,Replicas:properties.replicas,Running:properties.runningState,Health:properties.healthState,Image:properties.template.containers[0].image}" \
            -o table


          echo ""
          echo "=============================================="
          echo "ROLLBACK / DEPLOYMENT COMPLETE"
          echo "=============================================="