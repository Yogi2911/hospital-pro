name: Multi Environment Deployment

on:
  push:
    branches:
      - dev
      - qa
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: "Select target environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod

      deploy_tag:
        description: "Select image version to deploy"
        required: true
        type: choice
        options:
          - latest
          - latest -1
          - latest -2
          - latest -3
          - latest -4

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: Hosp-Task-26

  DEV_ACR_NAME: hospdevacr26
  DEV_ACR_LOGIN_SERVER: hospdevacr26.azurecr.io

  QA_ACR_NAME: hospacrqa
  QA_ACR_LOGIN_SERVER: hospacrqa.azurecr.io

  PROD_ACR_NAME: hospacr26
  PROD_ACR_LOGIN_SERVER: hospacr26.azurecr.io

  IMAGE_NAME: hospital-api

  DEV_APP: hospital-dev
  QA_APP: hospital-qa
  PROD_APP: hospital-prod

jobs:

  deploy:

    runs-on: ubuntu-latest

    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || (github.ref_name == 'main' && 'prod' || github.ref_name) }}

    steps:

      ###########################################################
      # Checkout
      ###########################################################

      - name: Checkout
        uses: actions/checkout@v4


      ###########################################################
      # Azure Login
      ###########################################################

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      ###########################################################
      # Decide Environment
      ###########################################################

      - name: Decide Environment
        run: |

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            ENV="${{ github.event.inputs.environment }}"

          else

            BRANCH="${GITHUB_REF_NAME}"

            if [ "$BRANCH" = "dev" ]; then
              ENV="dev"

            elif [ "$BRANCH" = "qa" ]; then
              ENV="qa"

            elif [ "$BRANCH" = "main" ]; then
              ENV="prod"

            else
              echo "Unsupported branch: $BRANCH"
              exit 1
            fi

          fi

          echo "DEPLOY_ENV=$ENV" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "Deployment Environment: $ENV"
          echo "=========================================="


      ###########################################################
      # Select Environment Resources
      ###########################################################

      - name: Select Environment Resources
        run: |

          if [ "$DEPLOY_ENV" = "dev" ]; then

            echo "ACR_NAME=$DEV_ACR_NAME" >> "$GITHUB_ENV"
            echo "ACR_LOGIN_SERVER=$DEV_ACR_LOGIN_SERVER" >> "$GITHUB_ENV"
            echo "APP_NAME=$DEV_APP" >> "$GITHUB_ENV"

          elif [ "$DEPLOY_ENV" = "qa" ]; then

            echo "ACR_NAME=$QA_ACR_NAME" >> "$GITHUB_ENV"
            echo "ACR_LOGIN_SERVER=$QA_ACR_LOGIN_SERVER" >> "$GITHUB_ENV"
            echo "APP_NAME=$QA_APP" >> "$GITHUB_ENV"

          elif [ "$DEPLOY_ENV" = "prod" ]; then

            echo "ACR_NAME=$PROD_ACR_NAME" >> "$GITHUB_ENV"
            echo "ACR_LOGIN_SERVER=$PROD_ACR_LOGIN_SERVER" >> "$GITHUB_ENV"
            echo "APP_NAME=$PROD_APP" >> "$GITHUB_ENV"

          else

            echo "Unsupported environment: $DEPLOY_ENV"
            exit 1

          fi

          echo "=========================================="
          echo "ACR          : $ACR_NAME"
          echo "ACR Server   : $ACR_LOGIN_SERVER"
          echo "Container App: $APP_NAME"
          echo "=========================================="


      ###########################################################
      # Login to Selected ACR
      ###########################################################

      - name: Login to ACR
        run: |

          echo "Logging into ACR: $ACR_NAME"

          az acr login \
            --name "$ACR_NAME"


      ###########################################################
      # AUTOMATIC DEPLOYMENT
      #
      # Push to:
      #
      # dev  -> hospdevacr26
      # qa   -> hospacrqa
      # main -> hospacr26
      ##########################################################

      - name: Generate Image Version
        if: github.event_name == 'push'
        run: |

          VERSION="${{ vars.VERSION }}"
          BUILD="${{ github.run_number }}"

          if [ -z "$VERSION" ]; then
            echo "ERROR: VERSION variable is not configured."
            exit 1
          fi

          IMAGE_TAG="v${VERSION}-${DEPLOY_ENV}-b${BUILD}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "New Image Tag: $IMAGE_TAG"
          echo "=========================================="


      ###########################################################
      # Build Docker Image
      ###########################################################

      - name: Build Docker Image
        if: github.event_name == 'push'
        run: |

          echo "Building Docker image..."

          docker build \
            -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG" \
            .

          echo "Build completed."


      ###########################################################
      # Push Docker Image
      ###########################################################

      - name: Push Docker Image
        if: github.event_name == 'push'
        run: |

          echo "Pushing image to:"
          echo "$ACR_LOGIN_SERVER"

          docker push \
            "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"

          echo "Image pushed successfully."


      ###########################################################
      # SHOW AVAILABLE IMAGES
      #
      # This is visible in GitHub Actions logs.
      ###########################################################

      - name: Show Available Images
        if: github.event_name == 'workflow_dispatch'
        run: |

          echo ""
          echo "=========================================="
          echo "AVAILABLE $DEPLOY_ENV IMAGES"
          echo "=========================================="

          TAGS=$(az acr repository show-tags \
            --name "$ACR_NAME" \
            --repository "$IMAGE_NAME" \
            --orderby time_desc \
            --output json)

          echo "$TAGS" | jq -r '
            to_entries[] |
            "\(.key) -> \(.value)"
          '

          echo "=========================================="


      ###########################################################
      # Select Existing Image for Manual Deployment
      #
      # latest     -> index 0
      # latest -1  -> index 1
      # latest -2  -> index 2
      # latest -3  -> index 3
      # latest -4  -> index 4
      ###########################################################

      - name: Select Deployment Image
        if: github.event_name == 'workflow_dispatch'
        run: |

          SELECTED_TAG="${{ github.event.inputs.deploy_tag }}"

          echo "Requested deployment: $SELECTED_TAG"

          #######################################################
          # Convert selection into array index
          #######################################################

          if [ "$SELECTED_TAG" = "latest" ]; then

            INDEX=0

          else

            INDEX=$(echo "$SELECTED_TAG" | sed 's/latest -//')

          fi

          echo "Selected image index: $INDEX"


          #######################################################
          # Get environment-specific images
          #
          # DEV:
          # v*-dev-b*
          #
          # QA:
          # v*-qa-b*
          #
          # PROD:
          # v*-prod-b*
          #######################################################

          if [ "$DEPLOY_ENV" = "dev" ]; then

            PREFIX="-dev-b"

          elif [ "$DEPLOY_ENV" = "qa" ]; then

            PREFIX="-qa-b"

          elif [ "$DEPLOY_ENV" = "prod" ]; then

            PREFIX="-prod-b"

          else

            echo "Invalid environment."
            exit 1

          fi


          echo "Searching for images containing: $PREFIX"


          #######################################################
          # Get tags ordered by creation time
          #######################################################

          TAGS=$(az acr repository show-tags \
            --name "$ACR_NAME" \
            --repository "$IMAGE_NAME" \
            --orderby time_desc \
            --output json \
            --query "[?contains(@, '$PREFIX')]")

          echo ""
          echo "Environment images:"
          echo "$TAGS" | jq -r '.[]'


          #######################################################
          # Select image
          #######################################################

          IMAGE_TAG=$(echo "$TAGS" | jq -r ".[$INDEX]")


          #######################################################
          # Validate image
          #######################################################

          if [ "$IMAGE_TAG" = "null" ] || [ -z "$IMAGE_TAG" ]; then

            echo ""
            echo "ERROR: Requested image does not exist."
            echo ""
            echo "Requested:"
            echo "$SELECTED_TAG"
            echo ""
            echo "Available images:"
            echo "$TAGS" | jq -r '.[]'

            exit 1

          fi


          #######################################################
          # Save selected image
          #######################################################

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          echo ""
          echo "=========================================="
          echo "SELECTED IMAGE"
          echo "=========================================="
          echo "$IMAGE_TAG"
          echo "=========================================="


      ###########################################################
      # Check Container App
      ###########################################################

      - name: Check Container App
        run: |

          echo "Checking Container App..."

          if ! az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --only-show-errors \
            --output none; then

            echo ""
            echo "ERROR: Container App does not exist."
            echo "App: $APP_NAME"
            exit 1

          fi

          echo "Container App exists: $APP_NAME"


      ###########################################################
      # Deploy Container App
      ###########################################################

      - name: Deploy Container App
        run: |

          FULL_IMAGE="$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"

          echo ""
          echo "=========================================="
          echo "DEPLOYMENT"
          echo "=========================================="
          echo "Environment : $DEPLOY_ENV"
          echo "ACR         : $ACR_NAME"
          echo "Container App: $APP_NAME"
          echo "Image       : $FULL_IMAGE"
          echo "=========================================="


          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$FULL_IMAGE"


      ###########################################################
      # Show Final Deployment
      ###########################################################

      - name: Show Deployment
        run: |

          CURRENT_IMAGE=$(az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.template.containers[0].image" \
            --output tsv)

          echo ""
          echo "=========================================="
          echo "DEPLOYMENT SUCCESSFUL"
          echo "=========================================="
          echo "Environment  : $DEPLOY_ENV"
          echo "ACR          : $ACR_NAME"
          echo "Container App: $APP_NAME"
          echo "Image        : $CURRENT_IMAGE"
          echo "=========================================="
