name: Multi Environment Deployment

on:
  push:
    branches:
      - dev
      - qa
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod

      deploy_tag:
        description: "Select image to deploy"
        required: true
        type: choice
        options:
          - latest
          - latest -1
          - latest -2
          - latest -3
          - latest -4

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: Hosp-Task-26
  IMAGE_NAME: hospital-api

  DEV_APP: hospital-dev
  QA_APP: hospital-qa
  PROD_APP: hospital-prod

jobs:

  deploy:

    runs-on: ubuntu-latest

    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || (github.ref_name == 'main' && 'prod' || github.ref_name) }}

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # 2. AZURE LOGIN
      # ==========================================================

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      # ==========================================================
      # 3. DECIDE ENVIRONMENT
      # ==========================================================

      - name: Decide Environment
        shell: bash
        run: |

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            DEPLOY_ENV="${{ github.event.inputs.environment }}"

          else

            BRANCH="${GITHUB_REF_NAME}"

            if [ "$BRANCH" = "dev" ]; then

              DEPLOY_ENV="dev"

            elif [ "$BRANCH" = "qa" ]; then

              DEPLOY_ENV="qa"

            elif [ "$BRANCH" = "main" ]; then

              DEPLOY_ENV="prod"

            else

              echo "Invalid branch: $BRANCH"
              exit 1

            fi

          fi

          echo "DEPLOY_ENV=$DEPLOY_ENV" >> "$GITHUB_ENV"

          echo "======================================"
          echo "Environment: $DEPLOY_ENV"
          echo "======================================"


      # ==========================================================
      # 4. SELECT ACR + CONTAINER APP
      # ==========================================================

      - name: Select ACR and Container App
        shell: bash
        run: |

          if [ "$DEPLOY_ENV" = "dev" ]; then

            echo "ACR_NAME=hospdevacr26" >> "$GITHUB_ENV"
            echo "ACR_LOGIN_SERVER=hospdevacr26.azurecr.io" >> "$GITHUB_ENV"
            echo "APP_NAME=$DEV_APP" >> "$GITHUB_ENV"

          elif [ "$DEPLOY_ENV" = "qa" ]; then

            echo "ACR_NAME=hospacrqa" >> "$GITHUB_ENV"
            echo "ACR_LOGIN_SERVER=hospacrqa.azurecr.io" >> "$GITHUB_ENV"
            echo "APP_NAME=$QA_APP" >> "$GITHUB_ENV"

          elif [ "$DEPLOY_ENV" = "prod" ]; then

            echo "ACR_NAME=hospacr26" >> "$GITHUB_ENV"
            echo "ACR_LOGIN_SERVER=hospacr26.azurecr.io" >> "$GITHUB_ENV"
            echo "APP_NAME=$PROD_APP" >> "$GITHUB_ENV"

          else

            echo "Invalid environment"
            exit 1

          fi

          echo "======================================"
          echo "Environment : $DEPLOY_ENV"
          echo "Registry    : $ACR_NAME"
          echo "Server      : $ACR_LOGIN_SERVER"
          echo "App         : $APP_NAME"
          echo "======================================"


      # ==========================================================
      # 5. LOGIN TO ACR
      # ==========================================================

      - name: Login to ACR
        run: |

          echo "Logging into $ACR_NAME..."

          az acr login --name "$ACR_NAME"

          echo "ACR login successful."


      # ==========================================================
      # 6. AUTOMATIC IMAGE TAG
      #
      # Runs only for push
      # ==========================================================

      - name: Generate Automatic Image Tag
        if: github.event_name == 'push'
        shell: bash
        run: |

          VERSION="${{ vars.VERSION }}"

          if [ -z "$VERSION" ]; then
            echo "VERSION variable is not configured."
            echo "Please create VERSION variable in GitHub Environment."
            exit 1
          fi

          BUILD="${{ github.run_number }}"

          IMAGE_TAG="v${VERSION}-${DEPLOY_ENV}-b${BUILD}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          echo "======================================"
          echo "AUTOMATIC DEPLOYMENT"
          echo "======================================"
          echo "Environment : $DEPLOY_ENV"
          echo "Version     : $VERSION"
          echo "Build       : $BUILD"
          echo "Image Tag   : $IMAGE_TAG"
          echo "Registry    : $ACR_NAME"
          echo "======================================"


      # ==========================================================
      # 7. BUILD DOCKER IMAGE
      #
      # Only push deployment
      # ==========================================================

      - name: Build Docker Image
        if: github.event_name == 'push'
        shell: bash
        run: |

          echo "Building Docker image..."

          docker build \
            -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG" \
            .

          echo "Docker image built successfully."


      # ==========================================================
      # 8. PUSH DOCKER IMAGE
      #
      # Only push deployment
      # ==========================================================

      - name: Push Docker Image
        if: github.event_name == 'push'
        shell: bash
        run: |

          echo "Pushing Docker image..."

          docker push \
            "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"

          echo "Docker image pushed successfully."


            # ==========================================================
      # 9. GET ENVIRONMENT-SPECIFIC IMAGE HISTORY
      # ==========================================================

      - name: Get Latest 5 Environment Images
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |

          echo "======================================"
          echo "IMAGE HISTORY"
          echo "Environment : $DEPLOY_ENV"
          echo "Registry    : $ACR_NAME"
          echo "Repository  : $IMAGE_NAME"
          echo "======================================"

          echo ""
          echo "Filtering $DEPLOY_ENV images..."
          echo ""

          ALL_TAGS=$(az acr repository show-tags \
            --name "$ACR_NAME" \
            --repository "$IMAGE_NAME" \
            --output json)

          # Filter only tags belonging to the selected environment.
          # Example:
          # v1.0.0-dev-b14
          # v1.0.0-dev-b8
          # v1.0.0-dev-b1

          ENV_TAGS=$(echo "$ALL_TAGS" | jq -r --arg ENV "$DEPLOY_ENV" '
            .[]
            | select(test("^v[0-9.]+-" + $ENV + "-b[0-9]+$"))
          ' | while read TAG; do
                BUILD=$(echo "$TAG" | sed -E 's/.*-b([0-9]+)$/\1/')
                echo "$BUILD|$TAG"
            done | sort -t'|' -k1,1nr | head -5 | cut -d'|' -f2)

          if [ -z "$ENV_TAGS" ]; then
            echo ""
            echo "❌ No images found for environment: $DEPLOY_ENV"
            echo ""
            echo "All available tags:"
            echo "$ALL_TAGS" | jq -r '.[]'
            exit 1
          fi

          echo "Available rollback images:"
          echo "--------------------------------------"

          COUNT=0

          while read TAG; do
            echo "[$COUNT] $TAG"
            COUNT=$((COUNT + 1))
          done <<< "$ENV_TAGS"

          echo "--------------------------------------"
          echo "Total available: $COUNT"

      # ==========================================================
      # 10. DETERMINE ROLLBACK IMAGE
      #
      # latest     = newest
      # latest -1  = previous
      # latest -2  = 2 versions back
      # latest -3  = 3 versions back
      # latest -4  = 4 versions back
      # ==========================================================

      - name: Determine Rollback Image
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |

          SELECTED="${{ github.event.inputs.deploy_tag }}"

          echo "======================================"
          echo "ROLLBACK SELECTION"
          echo "======================================"

          echo "Environment : $DEPLOY_ENV"
          echo "Selection   : $SELECTED"
          echo "Registry    : $ACR_NAME"
          echo ""

          # ------------------------------------------------------
          # Get all tags
          # ------------------------------------------------------

          ALL_TAGS=$(az acr repository show-tags \
            --name "$ACR_NAME" \
            --repository "$IMAGE_NAME" \
            --output json)

          # ------------------------------------------------------
          # Filter only selected environment
          # and sort by numeric build number
          # ------------------------------------------------------

          ENV_TAGS=$(echo "$ALL_TAGS" | jq -r \
            --arg ENV "$DEPLOY_ENV" '
              [
                .[]
                | select(
                    test("^v[0-9.]+-" + $ENV + "-b[0-9]+$")
                  )
              ]
              | sort_by(
                  capture("-b(?<build>[0-9]+)$").build
                  | tonumber
                )
              | reverse
              | .[0:5]
              | .[]
            ')

          if [ -z "$ENV_TAGS" ]; then

            echo "======================================"
            echo "ROLLBACK FAILED"
            echo "======================================"

            echo "No images found for environment: $DEPLOY_ENV"

            exit 1

          fi

          echo "Latest 5 $DEPLOY_ENV images:"
          echo ""
          echo "$ENV_TAGS"
          echo ""

          # ------------------------------------------------------
          # Determine selected index
          # ------------------------------------------------------

          case "$SELECTED" in

            "latest")
              INDEX=0
              ;;

            "latest -1")
              INDEX=1
              ;;

            "latest -2")
              INDEX=2
              ;;

            "latest -3")
              INDEX=3
              ;;

            "latest -4")
              INDEX=4
              ;;

            *)
              echo "Invalid rollback selection: $SELECTED"
              exit 1
              ;;

          esac

          # ------------------------------------------------------
          # Select image
          # ------------------------------------------------------

          IMAGE_TAG=$(echo "$ENV_TAGS" | sed -n "$((INDEX + 1))p")

          # ------------------------------------------------------
          # Check selected image exists
          # ------------------------------------------------------

          if [ -z "$IMAGE_TAG" ]; then

            echo "======================================"
            echo "ROLLBACK FAILED"
            echo "======================================"

            echo "Requested : $SELECTED"
            echo "Available : $(echo "$ENV_TAGS" | wc -l)"

            exit 1

          fi

          # ------------------------------------------------------
          # Save image tag
          # ------------------------------------------------------

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          echo ""
          echo "======================================"
          echo "ROLLBACK READY"
          echo "======================================"

          echo "Environment : $DEPLOY_ENV"
          echo "Selection   : $SELECTED"
          echo "Image Tag   : $IMAGE_TAG"
          echo "Registry    : $ACR_NAME"
          echo "Image       : $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"

          echo "======================================"


      # ==========================================================
      # 11. DEPLOY CONTAINER APP
      #
      # Runs for:
      #   PUSH       -> new image
      #   ROLLBACK   -> selected old image
      # ==========================================================

      - name: Deploy Container App
        shell: bash
        run: |

          echo "======================================"
          echo "DEPLOYING CONTAINER APP"
          echo "======================================"

          echo "Environment : $DEPLOY_ENV"
          echo "Container   : $APP_NAME"
          echo "Registry    : $ACR_NAME"
          echo "Image       : $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"
          echo ""

          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"

          echo ""
          echo "Container App update completed."


      # ==========================================================
      # 12. VERIFY DEPLOYMENT
      # ==========================================================

      - name: Verify Deployment
        shell: bash
        run: |

          echo "======================================"
          echo "DEPLOYMENT COMPLETE"
          echo "======================================"

          echo "Environment : $DEPLOY_ENV"
          echo "Registry    : $ACR_NAME"
          echo "Image       : $IMAGE_TAG"
          echo "Container   : $APP_NAME"
          echo ""

          RUNNING_IMAGE=$(az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.template.containers[0].image" \
            -o tsv)

          echo "Currently deployed image:"
          echo "$RUNNING_IMAGE"

          echo ""

          if [ "$RUNNING_IMAGE" = "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG" ]; then

            echo "======================================"
            echo "VERIFICATION SUCCESSFUL"
            echo "======================================"

          else

            echo "======================================"
            echo "VERIFICATION FAILED"
            echo "======================================"

            echo "Expected:"
            echo "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"

            echo "Actual:"
            echo "$RUNNING_IMAGE"

            exit 1

          fi