name: Multi Environment Deployment
on:
  push:
    branches:
      - dev
      - qa
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: Hosp-Task-26
  ACR_NAME: hospacr26
  ACR_LOGIN_SERVER: hospacr26.azurecr.io
  IMAGE_NAME: hospital-api
  DEV_APP: hospital-dev
  QA_APP: hospital-qa
  PROD_APP: hospital-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || (github.ref_name == 'main' && 'prod' || github.ref_name) }}
    steps:
      
    ###########################################################

    - name: Checkout
      uses: actions/checkout@v4

    ###########################################################

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    ###########################################################

    - name: Login ACR
      run: |
        az acr login --name $ACR_NAME

    ###########################################################

    - name: Decide Environment
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          ENV=${{ github.event.inputs.environment }}
        else
          BRANCH=${GITHUB_REF_NAME}
          if [ "$BRANCH" = "dev" ]; then
            ENV=dev
          elif [ "$BRANCH" = "qa" ]; then
            ENV=qa
          else
            ENV=prod
          fi
        fi
        echo "DEPLOY_ENV=$ENV" >> $GITHUB_ENV

    ###########################################################

    - name: Generate Image Version
      run: |
        VERSION=${{ vars.VERSION }}
        BUILD=${{ github.run_number }}
        IMAGE_TAG=v${VERSION}-${DEPLOY_ENV}-b${BUILD}
        echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
        echo "Image Tag = $IMAGE_TAG"

    ###########################################################

    - name: Build Docker Image
      run: |
        docker build \
          -t $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG .

    ###########################################################

    - name: Push Docker Image
      run: |
        docker push \
          $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG

    ###########################################################

    - name: Select Container App
      run: |
        if [ "$DEPLOY_ENV" = "dev" ]; then
          echo "APP_NAME=$DEV_APP" >> $GITHUB_ENV
        elif [ "$DEPLOY_ENV" = "qa" ]; then
          echo "APP_NAME=$QA_APP" >> $GITHUB_ENV
        else
          echo "APP_NAME=$PROD_APP" >> $GITHUB_ENV
        fi

    ###########################################################

    - name: Deploy Container App
      run: |
        az containerapp update \
          --name $APP_NAME \
          --resource-group $RESOURCE_GROUP \
          --image $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG

   