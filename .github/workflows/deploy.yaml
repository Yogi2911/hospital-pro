name: Multi Environment Deployment

on:
  push:
    branches:
      - dev
      - qa
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: Hosp-Task-26
  IMAGE_NAME: hospital-api

  DEV_APP: hospital-dev
  QA_APP: hospital-qa
  PROD_APP: hospital-prod

jobs:

  deploy:

    runs-on: ubuntu-latest

    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || (github.ref_name == 'main' && 'prod' || github.ref_name) }}

    steps:

      ###########################################################
      # 1. Checkout
      ###########################################################

      - name: Checkout
        uses: actions/checkout@v4


      ###########################################################
      # 2. Azure Login
      ###########################################################

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      ###########################################################
      # 3. Decide Environment
      ###########################################################

      - name: Decide Environment
        shell: bash
        run: |

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            ENV="${{ github.event.inputs.environment }}"

          else

            BRANCH="${GITHUB_REF_NAME}"

            if [ "$BRANCH" = "dev" ]; then
              ENV="dev"

            elif [ "$BRANCH" = "qa" ]; then
              ENV="qa"

            elif [ "$BRANCH" = "main" ]; then
              ENV="prod"

            else
              echo "Invalid branch: $BRANCH"
              exit 1
            fi

          fi

          echo "DEPLOY_ENV=$ENV" >> "$GITHUB_ENV"

          echo "Environment = $ENV"


      ###########################################################
      # 4. Select ACR and Container App
      ###########################################################

      - name: Select Registry and Container App
        shell: bash
        run: |

          if [ "$DEPLOY_ENV" = "dev" ]; then

            echo "ACR_NAME=hospdevacr26" >> "$GITHUB_ENV"
            echo "ACR_LOGIN_SERVER=hospdevacr26.azurecr.io" >> "$GITHUB_ENV"
            echo "APP_NAME=$DEV_APP" >> "$GITHUB_ENV"

          elif [ "$DEPLOY_ENV" = "qa" ]; then

            echo "ACR_NAME=hospacrqa" >> "$GITHUB_ENV"
            echo "ACR_LOGIN_SERVER=hospacrqa.azurecr.io" >> "$GITHUB_ENV"
            echo "APP_NAME=$QA_APP" >> "$GITHUB_ENV"

          elif [ "$DEPLOY_ENV" = "prod" ]; then

            echo "ACR_NAME=hospacr26" >> "$GITHUB_ENV"
            echo "ACR_LOGIN_SERVER=hospacr26.azurecr.io" >> "$GITHUB_ENV"
            echo "APP_NAME=$PROD_APP" >> "$GITHUB_ENV"

          else

            echo "Invalid environment"
            exit 1

          fi

          echo "======================================"
          echo "Environment : $DEPLOY_ENV"
          echo "ACR         : $ACR_NAME"
          echo "Login Server: $ACR_LOGIN_SERVER"
          echo "App         : $APP_NAME"
          echo "======================================"


      ###########################################################
      # 5. Login to selected ACR
      ###########################################################

      - name: Login ACR
        run: |

          az acr login --name "$ACR_NAME"


      ###########################################################
      # 6. Generate Automatic Image Tag
      ###########################################################

      - name: Generate Image Version
        shell: bash
        run: |

          VERSION="${{ vars.VERSION }}"

          BUILD="${{ github.run_number }}"

          IMAGE_TAG="v${VERSION}-${DEPLOY_ENV}-b${BUILD}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          echo "======================================"
          echo "Generated Image Tag:"
          echo "$IMAGE_TAG"
          echo "======================================"


      ###########################################################
      # 7. Build Docker Image
      ###########################################################

      - name: Build Docker Image
        run: |

          docker build \
            -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG" \
            .


      ###########################################################
      # 8. Push Docker Image
      ###########################################################

      - name: Push Docker Image
        run: |

          docker push \
            "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"


      ###########################################################
      # 9. Verify Image Exists in ACR
      ###########################################################

      - name: Verify Image in ACR
        run: |

          echo "Checking image in ACR..."

          az acr repository show-tags \
            --name "$ACR_NAME" \
            --repository "$IMAGE_NAME" \
            --orderby time_desc \
            --top 5 \
            -o table


      ###########################################################
      # 10. Deploy Container App
      ###########################################################

      - name: Deploy Container App
        run: |

          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"


      ###########################################################
      # 11. Verify Container App
      ###########################################################

      - name: Verify Deployment
        run: |

          echo "======================================"
          echo "Deployment Completed"
          echo "======================================"

          echo "Environment : $DEPLOY_ENV"
          echo "Registry    : $ACR_NAME"
          echo "Image       : $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"
          echo "Container   : $APP_NAME"

          echo ""
          echo "Current Container App Image:"

          az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.template.containers[0].image" \
            -o tsv