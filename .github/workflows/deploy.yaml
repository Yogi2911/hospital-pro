name: Multi Environment Deployment

on:
  push:
    branches:
      - dev
      - qa
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: "Select target environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod

      deploy_tag:
        description: "Select image version to deploy"
        required: true
        type: choice
        options:
          - latest
          - latest -1
          - latest -2
          - latest -3
          - latest -4

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: Hosp-Task-26

  DEV_ACR_NAME: hospdevacr26
  DEV_ACR_LOGIN_SERVER: hospdevacr26.azurecr.io

  QA_ACR_NAME: hospacrqa
  QA_ACR_LOGIN_SERVER: hospacrqa.azurecr.io

  PROD_ACR_NAME: hospacr26
  PROD_ACR_LOGIN_SERVER: hospacr26.azurecr.io

  IMAGE_NAME: hospital-api

  DEV_APP: hospital-dev
  QA_APP: hospital-qa
  PROD_APP: hospital-prod


jobs:

  deploy:

    runs-on: ubuntu-latest

    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || (github.ref_name == 'main' && 'prod' || github.ref_name) }}

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =====================================================
      # AZURE LOGIN
      # =====================================================

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      # =====================================================
      # DECIDE ENVIRONMENT
      # =====================================================

      - name: Decide Environment
        run: |

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            ENV="${{ github.event.inputs.environment }}"

          else

            BRANCH="${GITHUB_REF_NAME}"

            if [ "$BRANCH" = "dev" ]; then
              ENV="dev"

            elif [ "$BRANCH" = "qa" ]; then
              ENV="qa"

            elif [ "$BRANCH" = "main" ]; then
              ENV="prod"

            else
              echo "Unsupported branch: $BRANCH"
              exit 1
            fi

          fi

          echo "DEPLOY_ENV=$ENV" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "Deployment Environment: $ENV"
          echo "=========================================="


      # =====================================================
      # SELECT ACR + CONTAINER APP
      # =====================================================

      - name: Select ACR
        run: |

          if [ "$DEPLOY_ENV" = "dev" ]; then

            echo "ACR_NAME=$DEV_ACR_NAME" >> "$GITHUB_ENV"
            echo "ACR_LOGIN_SERVER=$DEV_ACR_LOGIN_SERVER" >> "$GITHUB_ENV"
            echo "APP_NAME=$DEV_APP" >> "$GITHUB_ENV"

          elif [ "$DEPLOY_ENV" = "qa" ]; then

            echo "ACR_NAME=$QA_ACR_NAME" >> "$GITHUB_ENV"
            echo "ACR_LOGIN_SERVER=$QA_ACR_LOGIN_SERVER" >> "$GITHUB_ENV"
            echo "APP_NAME=$QA_APP" >> "$GITHUB_ENV"

          elif [ "$DEPLOY_ENV" = "prod" ]; then

            echo "ACR_NAME=$PROD_ACR_NAME" >> "$GITHUB_ENV"
            echo "ACR_LOGIN_SERVER=$PROD_ACR_LOGIN_SERVER" >> "$GITHUB_ENV"
            echo "APP_NAME=$PROD_APP" >> "$GITHUB_ENV"

          else

            echo "Unsupported environment"
            exit 1

          fi

          echo "=========================================="
          echo "ACR              : $ACR_NAME"
          echo "ACR Login Server  : $ACR_LOGIN_SERVER"
          echo "Container App     : $APP_NAME"
          echo "=========================================="


      # =====================================================
      # LOGIN TO ACR
      # =====================================================

      - name: Login to ACR
        run: |

          az acr login --name "$ACR_NAME"

          echo "Successfully logged into $ACR_NAME"


      # =====================================================
      # GENERATE / SELECT IMAGE
      #
      # PUSH:
      #   Always creates a NEW image.
      #
      # MANUAL latest:
      #   Creates a NEW image.
      #
      # MANUAL latest -1/-2/-3/-4:
      #   Uses EXISTING image.
      # =====================================================

      - name: Generate or Select Image
        run: |

          VERSION="${{ vars.VERSION }}"

          if [ -z "$VERSION" ]; then
            echo "ERROR: VERSION variable is not configured."
            exit 1
          fi

          PREFIX="v${VERSION}-${DEPLOY_ENV}-b"

          echo "=========================================="
          echo "VERSION : $VERSION"
          echo "PREFIX  : $PREFIX"
          echo "ACR     : $ACR_NAME"
          echo "=========================================="


          # =================================================
          # AUTOMATIC PUSH
          # =================================================

          if [ "${{ github.event_name }}" = "push" ]; then

            echo "Automatic branch deployment."
            echo "Creating a NEW image."


            TAGS=$(az acr repository show-tags \
              --name "$ACR_NAME" \
              --repository "$IMAGE_NAME" \
              --output json)


            MAX_BUILD=$(echo "$TAGS" | jq -r --arg prefix "$PREFIX" '

              map(
                select(startswith($prefix))
                | capture("b(?<number>[0-9]+)$").number
                | tonumber
              )

              | if length == 0 then
                  0
                else
                  max
                end
            ')


            NEXT_BUILD=$((MAX_BUILD + 1))

            IMAGE_TAG="${PREFIX}${NEXT_BUILD}"


            echo "=========================================="
            echo "Existing highest build : b$MAX_BUILD"
            echo "New build number        : b$NEXT_BUILD"
            echo "New image tag           : $IMAGE_TAG"
            echo "=========================================="


            echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
            echo "BUILD_NEW_IMAGE=true" >> "$GITHUB_ENV"


          # =================================================
          # MANUAL DEPLOYMENT
          # =================================================

          else

            SELECTED_TAG="${{ github.event.inputs.deploy_tag }}"

            echo "Manual deployment selected: $SELECTED_TAG"


            # =================================================
            # MANUAL latest
            #
            # latest = CREATE NEW IMAGE
            # =================================================

            if [ "$SELECTED_TAG" = "latest" ]; then

              echo "latest selected."
              echo "Creating a NEW image."


              TAGS=$(az acr repository show-tags \
                --name "$ACR_NAME" \
                --repository "$IMAGE_NAME" \
                --output json)


              MAX_BUILD=$(echo "$TAGS" | jq -r --arg prefix "$PREFIX" '

                map(
                  select(startswith($prefix))
                  | capture("b(?<number>[0-9]+)$").number
                  | tonumber
                )

                | if length == 0 then
                    0
                  else
                    max
                  end
              ')


              NEXT_BUILD=$((MAX_BUILD + 1))

              IMAGE_TAG="${PREFIX}${NEXT_BUILD}"


              echo "=========================================="
              echo "Existing highest build : b$MAX_BUILD"
              echo "New build number        : b$NEXT_BUILD"
              echo "New image tag           : $IMAGE_TAG"
              echo "=========================================="


              echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
              echo "BUILD_NEW_IMAGE=true" >> "$GITHUB_ENV"


            # =================================================
            # MANUAL latest -1/-2/-3/-4
            #
            # EXISTING IMAGE
            # =================================================

            else

              INDEX=$(echo "$SELECTED_TAG" | sed 's/latest -//')

              echo "Rollback index: $INDEX"


              TAGS=$(az acr repository show-tags \
                --name "$ACR_NAME" \
                --repository "$IMAGE_NAME" \
                --output json \
                --query "[?starts_with(@, '$PREFIX')]")


              # Sort by build number DESCENDING

              SORTED_TAGS=$(echo "$TAGS" | jq -r '

                map(
                  {
                    tag: .,
                    number: (
                      capture("b(?<number>[0-9]+)$").number
                      | tonumber
                    )
                  }
                )

                | sort_by(.number)
                | reverse

                | map(.tag)
              ')


              echo "=========================================="
              echo "Available images:"
              echo "$SORTED_TAGS"
              echo "=========================================="


              IMAGE_TAG=$(echo "$SORTED_TAGS" | jq -r ".[$INDEX]")


              if [ "$IMAGE_TAG" = "null" ] || [ -z "$IMAGE_TAG" ]; then

                echo "ERROR: Requested image does not exist."

                echo "Available images:"
                echo "$SORTED_TAGS"

                exit 1

              fi


              echo "=========================================="
              echo "Existing image selected:"
              echo "$IMAGE_TAG"
              echo "=========================================="


              echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
              echo "BUILD_NEW_IMAGE=false" >> "$GITHUB_ENV"

            fi

          fi


      # =====================================================
      # BUILD DOCKER IMAGE
      #
      # Only for NEW images.
      # =====================================================

      - name: Build Docker Image
        if: env.BUILD_NEW_IMAGE == 'true'
        run: |

          echo "=========================================="
          echo "BUILDING NEW IMAGE"
          echo "=========================================="

          echo "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"


          docker build \
            -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG" \
            .


      # =====================================================
      # PUSH DOCKER IMAGE
      #
      # Only for NEW images.
      # =====================================================

      - name: Push Docker Image
        if: env.BUILD_NEW_IMAGE == 'true'
        run: |

          echo "=========================================="
          echo "PUSHING NEW IMAGE"
          echo "=========================================="

          echo "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"


          docker push \
            "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"


      # =====================================================
      # CHECK CONTAINER APP
      # =====================================================

      - name: Check Container App
        run: |

          echo "Checking Container App:"
          echo "$APP_NAME"


          az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --only-show-errors \
            --output none


          if [ $? -ne 0 ]; then

            echo "ERROR: Container App does not exist."

            exit 1

          fi


          echo "Container App exists."


      # =====================================================
      # DEPLOY CONTAINER APP
      # =====================================================

      - name: Deploy Container App
        run: |

          FULL_IMAGE="$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"


          echo "=========================================="
          echo "DEPLOYMENT"
          echo "=========================================="

          echo "Environment : $DEPLOY_ENV"
          echo "ACR         : $ACR_NAME"
          echo "App         : $APP_NAME"
          echo "Image       : $FULL_IMAGE"
          echo "New Image   : $BUILD_NEW_IMAGE"

          echo "=========================================="


          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$FULL_IMAGE"


      # =====================================================
      # VERIFY DEPLOYMENT
      # =====================================================

      - name: Verify Deployment
        run: |

          EXPECTED_IMAGE="$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"


          CURRENT_IMAGE=$(az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.template.containers[0].image" \
            --output tsv)


          echo "=========================================="
          echo "DEPLOYMENT VERIFICATION"
          echo "=========================================="

          echo "Environment     : $DEPLOY_ENV"
          echo "ACR             : $ACR_NAME"
          echo "Container App   : $APP_NAME"
          echo "Selected Tag    : $IMAGE_TAG"
          echo "Expected Image  : $EXPECTED_IMAGE"
          echo "Actual Image    : $CURRENT_IMAGE"

          echo "=========================================="


          if [ "$CURRENT_IMAGE" = "$EXPECTED_IMAGE" ]; then

            echo "DEPLOYMENT SUCCESSFUL"
            echo "Container App is using the selected image."

          else

            echo "DEPLOYMENT VERIFICATION FAILED"

            echo "Expected: $EXPECTED_IMAGE"
            echo "Actual:   $CURRENT_IMAGE"

            exit 1

          fi